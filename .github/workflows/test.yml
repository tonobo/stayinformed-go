name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4
      - run: make helm
      - run: docker build -t stayinformed-go:test .
